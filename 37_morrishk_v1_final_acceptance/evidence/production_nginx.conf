server {
    listen 80;
    server_name www.morrishk.net;

    root /var/www/morrishk/web;
    index index.php;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 1) 尾斜杠统一 301（根路径除外）
    rewrite ^/(.+)/$ /$1 permanent;

    # 2) 禁止访问敏感目录与上传目录（上传实际存储在 runtime，Web 根之外）
    location ^~ /uploads/ { deny all; }
    location ^~ /runtime/ { deny all; }
    location ~* ^/(config|db|vendor|tests?)/ { deny all; }

    # 3) 静态资源直出，其余交给 Yii
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 4) .html / sitemap.xml / download 全部经 index.php
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # 5) 隐藏文件
    location ~ /\.(?!well-known) { deny all; }
}
